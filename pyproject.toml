[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-quality-agent"
version = "0.1.0"
description = "Profiles new data, auto-generates data-quality rules, flags anomalies and schema drift"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pyarrow>=14",
]

[project.optional-dependencies]
ai = ["google-genai>=1.0"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
dqa = "dqa.cli:main"

[tool.setuptools.packages.find]
include = ["dqa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
